<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="home-container">
    <div id="heading">
      <h1>Test your Knowledge!</h1>
      <p>Choose a category to start the quiz</p>
    </div>
    <div id="quiz-container">
      <div class="section" data-section="0">General Knowledge</div>
      <div class="section" data-section="1">Science</div>
      <div class="section" data-section="2">Mathematics</div>
      <div class="section" data-section="3">Indian History</div>
    </div>
  </div>
  <div id="question-container" style="display: none">
    <p id="score">score</p>
    <div id="question"></div>
    <div id="options"></div>
    <button id="next-button">Next</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
